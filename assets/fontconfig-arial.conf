<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Resume PDF builds: prefer real Microsoft Arial from msttcorefonts.
  Cursor/Cloud images remap Arial→Arimo in /etc/fonts/local.conf; pointing
  WeasyPrint at this file avoids that alias so the PDF embeds Arial.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/msttcorefonts</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir prefix="xdg">fontconfig-arial</cachedir>
</fontconfig>
